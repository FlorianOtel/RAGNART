# RAGNART package metadata. Pins as set in the v0.1 spin-off plan (2026-11-13).
# All pins match the shared venv's installed versions (checked 2026-11-13).
[project]
name = "ragnart"
version = "0.1.0"
description = "RAGNART — nested, three-tier RAG (Archive / Runtime / Transient), spun off from SoHoAI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The base install is the endpoint side (the operator's Mac, or any host that submits items): only the
# two packages the endpoint runner and its HTTP client import. On the Mac install the wheel with
# pip install --no-deps <artifact>, so no hub package is pulled in; the dependency check is in B.8.
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

# Optional extras. The hub extra is the hub side: the ingestion API, the intake worker, docling,
# embeddings and Qdrant. Install with: pip install -e ".[hub]"
[project.optional-dependencies]
hub = [
    "docling==2.89.0",
    "fastapi==0.135.1",
    "fastembed==0.8.0",
    "python-pptx==1.0.2",
    "qdrant-client==1.17.1",
    "tiktoken==0.12.0",
    "uvicorn==0.42.0",
]
# Test-only dependencies. Install with: pip install -e ".[test]"
test = [
    "pytest==9.0.3",
]

# Console entry point for the read-only CLI (ragnart/cli.py). Resolves once the package
# is installed; `python -m ragnart` works from the checkout without an install.
[project.scripts]
ragnart = "ragnart.cli:main"

# Build backend. Without an explicit package list, setuptools' flat-layout discovery
# finds the top-level `assets`, `config` and `ragnart` directories and refuses to build.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Only the `ragnart` package is shipped. `config/ragignore` is deliberately not packaged:
# ragnart/ragignore.py resolves it at runtime as <repo>/config/ragignore, relative to
# its own __file__, which an editable install points back at the checkout.
[tool.setuptools]
packages = ["ragnart"]
