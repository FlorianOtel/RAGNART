# =============================================================================
# RAGNART Configuration
# =============================================================================
# Split from the SoHoAI config on 2026-11-13 (RAGNART v0.1 spin-off).
# Contains only the RAG-relevant blocks. No YAML anchors or aliases are used
# in these blocks: every value is a literal (verified against the SoHoAI config
# on 2026-11-13), so no anchor handling is needed when reading this file.

# Change db_base_path to relocate all databases in one place.
# Python derives: {db_base_path}/sqlite/rag_state.db.
db_base_path: "/mnt/nfs/__Backups/RAGNART--databases"

#### -- RAG Settings (see RAG-strategy.md §7) ---------------------------------------
rag:
  embedding_model: "bge-m3"                      # 1024-dim, 8192-tok context, served by Ollama on Server 2 (see ollama_url)
  # ollama_url: "http://192.168.1.93:11434/api/embeddings"   # Ollama on Server 1 (explicit IP — not localhost)
  ollama_url: "http://192.168.1.95:11434/api/embeddings"   # Ollama on Server 2 (explicit IP — not localhost)
  opencode_api_url: "http://192.168.1.95:4096"  # OpenCode server — must match opencode.api_url
  top_k: 5
  # Parent-child chunking (see RAG-strategy.md §3.1):
  #   child: 200-300 tokens (embedded), parent: 800-1200 tokens (returned to LLM)
  #   Flat 512-token for PPTX / short TXT / YAML / config files
  qdrant_collection: "documents"
  qdrant_url: "http://192.168.1.93:6333"         # Qdrant on Server 1 (local NVMe)
  # Active Qdrant storage: /var/lib/qdrant/storage (local NVMe, Server 1)
  # Snapshots (DR):        /mnt/nfs/__Backups/RAGNART--databases/qdrant-snapshots/

  # -- Ingestion lock (shared across servers via NFS) ---------------------------
  # Single-writer lock taken by ragnart/lock.py (fcntl.lockf) for every writer of
  # the index: sync, ingest daemon, purge/reset tools in write mode, snapshot and run
  # scripts. Required key. NFSv4.1 with local_lock=none passes the lock to the NAS
  # lock manager (cross-machine). See docs/RAG-strategy.md §5.6.
  ingest_lock: "/mnt/nfs/__Backups/RAGNART--databases/rag-ingest.lock"

  # -- NAS ingestion side (utils/rag_sync_nfs.py, docs/RAGNART-design.md §10.3) --
  # The NAS sources (nas, claude-linux-shared-nfs, opencode-k11) run on the hub's host and submit to the
  # ingestion API like the Mac does. This block holds only paths: the secrets themselves live in the files
  # named below (directory 0700, files 0600), and are never written into this file.
  nas_ingest:
    # The ingestion API on the hub host. Loopback: the NAS side runs on the same host as the hub.
    hub_url: "http://127.0.0.1:8101"
    # Lock of the NAS ingestion run. Separate from rag.ingest_lock, which the intake worker and the
    # hub maintenance tools take. Both locks are taken by the snapshot (ragnart/lock.py).
    lock: "/mnt/nfs/__Backups/RAGNART--databases/rag-nas-ingest.lock"
    # The most rule-(c) resubmissions (older pipeline version) per run, so a version change does not spool
    # the whole corpus at once. Must be at least 1.
    resubmit_batch_size: 200
    # One secret file per source id (the source's Bearer secret, read once when the run starts).
    secrets:
      nas: "/home/florian/.ragnart/secrets/nas"
      claude-linux-shared-nfs: "/home/florian/.ragnart/secrets/claude-linux-shared-nfs"
      opencode-k11: "/home/florian/.ragnart/secrets/opencode-k11"

  # -- Cross-encoder reranking (RAG-strategy.md §6.3) ------------------------
  rerank:
    enabled: true                             # on by default; override via ?rerank=false or --no-rerank
    server_url: "http://192.168.1.95:8000/v1/rerank"
    model: "bge-reranker-v2-m3"
    fetch_multiplier: 6                       # Qdrant fetch = min(top_k * fetch_multiplier, fetch_cap)
    fetch_cap: 30                             # hard cap on Qdrant fetch pool
    timeout_seconds: 10.0                     # per-request HTTP timeout
    # Served by llama-swap on Server 2 (port 8000), which routes /v1/rerank by the
    # "model" field above -- so `model` must match the llama-swap model key exactly.
    # Backing llama-server runs with -c 768 -b 768 -ub 768 --reranking --pooling rank,
    # so the client does not truncate; the server handles typical queries + child chunks.
    # Coexists with qwen3.5-9b-q4 on GPU; verified 9,810 MiB used / 1,965 MiB free (10-min soak).

  # -- Hybrid sparse+dense retrieval (RAG-strategy.md §3.3, §6.1) -----------
  hybrid:
    enabled: true                             # default on; override per-call via hybrid=False
    sparse_vector_name: "sparse_text"
    dense_fetch: 30                           # candidates from dense prefetch branch
    sparse_fetch: 30                          # candidates from sparse prefetch branch
    rrf_k: 60                                 # RRF constant k (standard: 60)

  # -- Search-time result shaping (RAGNART-design.md §9.1, §9.2) -------------
  search:
    # Per-source cap on one result list: at most this many passages from any
    # one source_path, applied after reranking and before the top_k cut.
    # Overridable per request via ?max_hits_per_source=N on GET /v1/search.
    max_hits_per_source: 3

  # -- Ingestion admission (p1 admission rules, see docs/RAGNART-design.md §5) ---
  # Applied by ragnart/ingest.py to every queued item before any embedding work.
  # An item that breaks a rule is marked 'ignored' with the reason as skip_reason.
  admission:
    max_text_file_size_bytes: 5000000       # text-like files above this size are rejected before reading
    max_chunks_per_item: 5000               # any item producing more chunks than this is rejected before embedding
    fffd_ratio_threshold: 0.005             # text-like files whose decoded text has more U+FFFD replacement chars than this are rejected

  # -- Sync safety (utils/rag_sync_nfs.py) ----------------------------------------
  sync:
    # Deletion is refused when it would remove more than this fraction of all
    # completed rows in one run. Override for one run with --allow-mass-delete.
    max_delete_fraction: 0.10

  # -- NFS scanner filters ------------------------------------------------------
  # Inclusion rules only. Exclusions live in config/ragignore (global) and in
  # per-directory .ragignore files under the crawled roots (see ragnart/ragignore.py).
  scanner:
    # File extensions to ingest (whitelist).
    include_extensions:
      - .pdf
      - .pptx
      - .docx
      - .md
      - .sh
      - .txt
      # - .csv               # disabled: bulk data exports (362k of 378k CSV points were dumps). Re-enable per need.
      - .yaml
      - .yml
      - .ipynb
      - .html
      - .jsonl # Claude chats

# -- Multi-user NFS roots (maps Google email → owner + NFS paths) -------------
users:
  florian.otel@gmail.com:
    owner: "florian"
    nfs_roots: ["/mnt/nfs/Florian"]
  # eva.otel@gmail.com
  # owner: "eva"
  # nfs_roots: ["/mnt/nfs/Eva"]
  # annika@example.com:
  # owner: "annika"
  # nfs_roots: ["/mnt/nfs/Annika"]
  # laura@example.com:
  # owner: "laura"
  # nfs_roots: ["/mnt/nfs/Laura"]
shared:
  owner: "la-familia"
  nfs_roots: ["/mnt/nfs/La-Familia"]

# -- Claude Code session ingestion -----------------------------------------------
claude_chats:
  roots:
    - path: /home/florian/.claude/projects
      owner: florian

# -- OpenCode session ingestion ---------------------------------------------------
# Scanner walks GET /api/session (v2 paginated) which returns every session
# opencode knows about, regardless of cwd-at-launch. session.directory is just
# metadata, not classification — so there's no path-prefix filter here.
opencode:
  api_url: "http://192.168.1.95:4096"
  owner: florian
  # OpenCode 2.x requires HTTP Basic auth (user "opencode"). The password is read
  # from OPENCODE_SERVER_PASSWORD in the server's own env file, on the ingest host
  # (Server 2, where rag-ingest.timer runs and the OpenCode server lives).
  password_env_file: "~/.config/opencode/opencode-server.env"
